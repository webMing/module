# 工作区根的静态分析配置。
#
# 这里没有 Dart 代码：真正的规则由每个成员包自己的 analysis_options.yaml
# 生效（它们都 include package:flutter_lints/flutter.yaml）。保留本文件是
# 为了让 IDE 在仓库根打开时也有一致的排除项。
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - apps/*/build/**
    - apps/*/android/**
    - apps/*/ios/**
    - apps/*/web/**
    - apps/*/windows/**
    - apps/*/macos/**
    - apps/*/linux/**
    - packages/*/*/build/**
