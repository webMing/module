name: module_workspace
description: "Flutter 模块化架构 monorepo 工作区根：apps/ + packages/{core,features,shared}。"
publish_to: 'none'

environment:
  sdk: ^3.13.3

# 唯一的依赖解析入口：整仓库共享一份 pubspec.lock 与 package_config.json。
workspace:
  - apps/main_app
  - packages/core/*
  - packages/features/*
  - packages/shared/*

dev_dependencies:
  melos: ^8.7.0
  very_good_analysis: ^11.0.0

# 工作区根不是应用包，只是 monorepo 配置的宿主。
melos:
  useRootAsPackage: false
  scripts:
    get:
      description: Resolve all Pub Workspace dependencies.
      run: dart pub get
    check:
      description: Analyze and test every package in the workspace.
      run: dart run melos analyze && dart run melos test
    format:check:
      description: Check Dart formatting without changing files.
      run: dart run melos format --set-exit-if-changed
    format:fix:
      description: Format all Dart source files.
      run: dart run melos format --output write
